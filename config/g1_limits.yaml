# Limits for the safety layer (humanoid_arc_bme/onboard/api/safety.py).
#
# STATUS: PLACEHOLDER. `validated_on_robot: false` until step B3.3 has replaced these
# values with the real robot's own limits. Joint position limits are the URDF's
# (humanoid_arc_bme/robots/g1/g1_29dof_with_hand_only_kinematics.urdf); the safety layer
# keeps `pos_margin_rad` inside them. Velocity, workspace and base values are the initial
# conservative ones of docs/plan/B-robot-g1.md B1.4 (arms/base <= 0.2 m/s) and must be
# measured and signed off before any hardware step uses them.
validated_on_robot: false
pos_margin_rad: 0.05
joint_vel_max_default: 1.0        # rad/s, every commanded joint (URDF hardware max is 12-37 rad/s)
wrist_speed_max: 0.2              # m/s, wrist target position change per second
workspace:                        # wrist target position box, pelvis frame, metres
  frame: pelvis
  min: [-0.10, -0.55, -0.35]
  max: [0.55, 0.55, 0.55]
base_vel_max:                     # absolute limits of the planar base command
  vx: 0.2                         # m/s
  vy: 0.1                         # m/s
  wz: 0.3                         # rad/s
joint_vel_max:                    # rad/s per joint, overrides joint_vel_max_default. Legs only, for the W4 leg policy's
                                  # joint-target path: the URDF hardware maximum (velocity="..."), NOT a validated safety
                                  # value. S1's speed rule limits the change of the COMMANDED target per tick (reference =
                                  # the previous applied target, SafetyLayer.joint_rate_reference), not |target - measured|.
                                  # At these values the rule is effectively off for the legs (SR-12): the first walk uses
                                  # config/g1_limits_firstwalk.yaml (serve --limits g1_limits_firstwalk.yaml).
  left_hip_pitch_joint: 32.0
  right_hip_pitch_joint: 32.0
  left_hip_roll_joint: 20.0
  right_hip_roll_joint: 20.0
  left_hip_yaw_joint: 32.0
  right_hip_yaw_joint: 32.0
  left_knee_joint: 20.0
  right_knee_joint: 20.0
  left_ankle_pitch_joint: 37.0
  right_ankle_pitch_joint: 37.0
  left_ankle_roll_joint: 37.0
  right_ankle_roll_joint: 37.0
joints:                           # rad, from the URDF
  left_ankle_pitch_joint: {lower: -0.87267, upper: 0.52360}
  left_ankle_roll_joint: {lower: -0.26180, upper: 0.26180}
  left_elbow_joint: {lower: -1.04720, upper: 2.09440}
  left_hand_index_0_joint: {lower: -1.57080, upper: 0.00000}
  left_hand_index_1_joint: {lower: -1.74533, upper: 0.00000}
  left_hand_middle_0_joint: {lower: -1.57080, upper: 0.00000}
  left_hand_middle_1_joint: {lower: -1.74533, upper: 0.00000}
  left_hand_thumb_0_joint: {lower: -1.04720, upper: 1.04720}
  left_hand_thumb_1_joint: {lower: -0.72431, upper: 1.04720}
  left_hand_thumb_2_joint: {lower: 0.00000, upper: 1.74533}
  left_hip_pitch_joint: {lower: -2.53070, upper: 2.87980}
  left_hip_roll_joint: {lower: -0.52360, upper: 2.96710}
  left_hip_yaw_joint: {lower: -2.75760, upper: 2.75760}
  left_knee_joint: {lower: -0.08727, upper: 2.87980}
  left_shoulder_pitch_joint: {lower: -3.08920, upper: 2.67040}
  left_shoulder_roll_joint: {lower: -1.58820, upper: 2.25150}
  left_shoulder_yaw_joint: {lower: -2.61800, upper: 2.61800}
  left_wrist_pitch_joint: {lower: -1.61443, upper: 1.61443}
  left_wrist_roll_joint: {lower: -1.97222, upper: 1.97222}
  left_wrist_yaw_joint: {lower: -1.61443, upper: 1.61443}
  right_ankle_pitch_joint: {lower: -0.87267, upper: 0.52360}
  right_ankle_roll_joint: {lower: -0.26180, upper: 0.26180}
  right_elbow_joint: {lower: -1.04720, upper: 2.09440}
  right_hand_index_0_joint: {lower: 0.00000, upper: 1.57080}
  right_hand_index_1_joint: {lower: 0.00000, upper: 1.74533}
  right_hand_middle_0_joint: {lower: 0.00000, upper: 1.57080}
  right_hand_middle_1_joint: {lower: 0.00000, upper: 1.74533}
  right_hand_thumb_0_joint: {lower: -1.04720, upper: 1.04720}
  right_hand_thumb_1_joint: {lower: -1.04720, upper: 0.72431}
  right_hand_thumb_2_joint: {lower: -1.74533, upper: 0.00000}
  right_hip_pitch_joint: {lower: -2.53070, upper: 2.87980}
  right_hip_roll_joint: {lower: -2.96710, upper: 0.52360}
  right_hip_yaw_joint: {lower: -2.75760, upper: 2.75760}
  right_knee_joint: {lower: -0.08727, upper: 2.87980}
  right_shoulder_pitch_joint: {lower: -3.08920, upper: 2.67040}
